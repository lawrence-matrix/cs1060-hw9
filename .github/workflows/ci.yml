name: CI

on:
  push:
    branches:
      - main
      - lawrence-matrix-hw9
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository contents
        run: |
          echo "Repository path: $GITHUB_WORKSPACE"
          ls -la
      - name: Run default test command if available
        run: |
          if [ -f package.json ]; then
            npm install
            npm test
          else
            echo "No package.json found; no tests configured yet."
          fi
